# Local dev-tooling automation for tokensave — installed via a dedicated `pre-commit install`
# invocation targeting only the post-* git hook stages (see README). Deliberately kept out of
# .pre-commit-config.yaml, which is the CI-enforced quality-gate config.
repos:
  - repo: local
    hooks:
      - id: tokensave-sync
        name: tokensave sync
        entry: tokensave sync
        language: system
        stages: [post-commit, post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
        verbose: true

      - id: tokensave-branch-add
        name: tokensave branch add
        entry: tokensave branch add
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
        verbose: true

      - id: tokensave-branch-gc
        name: tokensave branch gc
        entry: tokensave branch gc
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
        verbose: true
