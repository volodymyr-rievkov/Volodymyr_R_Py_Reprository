# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=64', '--enforce-all']
        exclude: (^|/)uv\.lock$
    -   id: detect-aws-credentials
        args: ['--allow-missing-credentials']
    -   id: detect-private-key
    -   id: check-ast
    -   id: check-case-conflict
    -   id: check-executables-have-shebangs
    -   id: check-illegal-windows-names
    -   id: check-json
    -   id: check-shebang-scripts-are-executable
    -   id: check-symlinks
    -   id: check-toml
    -   id: mixed-line-ending
    -   id: name-tests-test

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
        - id: commitlint
          verbose: true
          pass_filenames: true
          stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: python
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format --diff
        language: python
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy
        language: python
        types: [python]
        require_serial: true # MyPy is often recommended to run serially